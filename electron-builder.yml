appId: com.sucai.manager
productName: SuHub
copyright: 仅供个人使用
directories:
  output: release
npmRebuild: false
files:
  - out/**
  - package.json
asarUnpack:
  - '**/node_modules/better-sqlite3/**'
extraResources:
  - from: node_modules/ffmpeg-static/ffmpeg.exe
    to: bin/ffmpeg.exe
  - from: node_modules/ffprobe-static/bin/win32/x64/ffprobe.exe
    to: bin/ffprobe.exe
win:
  icon: build/icon.png
  target:
    - target: nsis
      arch:
        - x64
  artifactName: SuHub-安装包-${version}.exe
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: SuHub
electronDownload:
  mirror: https://npmmirror.com/mirrors/electron/
